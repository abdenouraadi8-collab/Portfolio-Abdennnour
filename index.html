<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdennour Aadi | E-Portfolio & Cybersecurity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-light: #e0f2fe;
            --primary-dark: #0369a1;
            --dark: #0f172a;
            --gray-light: #f8fafc;
            --gray-border: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--gray-light);
            color: var(--dark);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
        }

        .header-content h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .header-content p {
            font-size: 1.25rem;
            opacity: 0.95;
            max-width: 650px;
            margin: 0 auto 1.5rem auto;
        }

        .contact-pills {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .pill {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 0.5rem 1.2rem;
            border-radius: 99px;
            font-size: 0.9rem;
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .pill:hover {
            background: white;
            color: var(--primary-dark);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        section {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--gray-border);
        }

        h2 {
            font-size: 1.6rem;
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .video-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 1.5rem auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
